name: Continuous Integration

# Trigger the workflow when code is pushed to develop or main.
on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main
jobs:
  build:
    # Use a temporary Ubuntu runner to execute the CI job.
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the runner.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install the required .NET SDK version.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Download all NuGet package dependencies.
      - name: Restore dependencies
        run: dotnet restore SupportFlow.slnx

      # Compile the solution in Release configuration.
      - name: Build solution
        run: dotnet build SupportFlow.slnx --configuration Release --no-restore

      # Run all automated tests in the solution.
      - name: Run tests
        run: dotnet test SupportFlow.slnx --configuration Release --no-build